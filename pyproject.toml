[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "leuze-rsl"
dynamic = ["version"]
authors = [
  { name = "0xarnio" },
]
description = "Python driver for the measurement data output (UDP data telegrams) of Leuze RSL 235 safety laser scanners"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["leuze", "rsl235", "rsl200", "rsl400", "rod300", "rod500", "laser scanner", "lidar", "agv", "udp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/0xarn-io/leuze-rsl"
Repository = "https://github.com/0xarn-io/leuze-rsl"
Issues = "https://github.com/0xarn-io/leuze-rsl/issues"
Changelog = "https://github.com/0xarn-io/leuze-rsl/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "leuze_rsl.__version__" }

[tool.setuptools.package-data]
leuze_rsl = ["py.typed"]

[tool.mypy]
strict = true
files = ["src/leuze_rsl"]
