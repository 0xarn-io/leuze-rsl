[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leuze-rsl"
version = "0.2.0"
description = "Python driver for the measurement data output (UDP data telegrams) of Leuze RSL 235 safety laser scanners"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["leuze", "rsl235", "rsl200", "rod300", "rod500", "laser scanner", "lidar", "agv", "udp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Repository = "https://github.com/0xarn-io/leuze-rsl"

[tool.setuptools]
packages = ["leuze-rsl"]

[tool.setuptools.package-data]
leuze-rsl = ["py.leuze-rsl"]
